<form class="sb-form" role="search">
  <div class="sb-input-wrap">
    <input class="sb-input" type="search" autocomplete="off">
    <ul class="sb-suggestions" role="listbox" hidden></ul>
  </div>
  <button class="sb-submit" type="submit">Search</button>
</form>
<div class="sb-status" aria-live="polite"></div>
<div class="sb-body">
  <aside class="sb-facets" hidden></aside>
  <div class="sb-main">
    <ol class="sb-featured" hidden></ol>
    <ol class="sb-results"></ol>
    <nav class="sb-pagination" aria-label="Search results pages"></nav>
  </div>
</div>
